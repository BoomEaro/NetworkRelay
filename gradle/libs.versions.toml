[versions]
netty = "4.2.16.Final"
lombok = "1.18.46"
guava = "33.6.0-jre"
log4j = "2.26.1"
caffeine = "3.2.3"
dsiutils = "2.7.4"
slf4j-api = "2.0.18"
slf4j-jdk = "2.0.18"
jline-terminal = "4.3.1"
disruptor = "4.0.0"
console-appender = "1.3.0"
shadow = "9.5.1"
configurate-yaml = "4.2.0"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate-yaml" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }
slf4j-jdk = { module = "org.slf4j:slf4j-jdk14", version.ref = "slf4j-jdk" }

console-appender = { module = "net.minecrell:terminalconsoleappender", version.ref = "console-appender" }

caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

dsiutils = { module = "it.unimi.dsi:dsiutils", version.ref = "dsiutils" }

jline-reader = { module = "org.jline:jline-reader", version.ref = "jline-terminal" }
jline-terminal-jni = { module = "org.jline:jline-terminal-jni", version.ref = "jline-terminal" }

netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-transport-native-io_uring= { module = "io.netty:netty-transport-native-io_uring", version.ref = "netty"}
netty-codec-haproxy = { module = "io.netty:netty-codec-haproxy", version.ref = "netty" }

logj4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
logj4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
logj4j-slf4j-impl = { module = "org.apache.logging.log4j:log4j-slf4j-impl", version.ref = "log4j" }
logj4j-iostreams = { module = "org.apache.logging.log4j:log4j-iostreams", version.ref = "log4j" }
logj4j-jul = { module = "org.apache.logging.log4j:log4j-jul", version.ref = "log4j" }

disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }

[bundles]
log4j = ["logj4j-api", "logj4j-core", "logj4j-slf4j-impl", "logj4j-iostreams", "logj4j-jul"]
jline-terminal = ["jline-reader", "jline-terminal-jni"]